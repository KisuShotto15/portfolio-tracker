<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFDE59"/>
      <stop offset="1" stop-color="#F2C118"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
  <g stroke="#1A1A1A" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- pico rojo (izquierda) -->
    <polygon points="27,47 9,51 9,61 27,60" fill="#E8542F"/>
    <polygon points="9,56 9,61 27,60 27,55" fill="#C93A1D"/>
    <!-- cubo isometrico -->
    <polygon points="52,16 79,32 79,64 52,80 25,64 25,32" fill="#F7DC3D"/>
    <polygon points="52,16 79,32 52,48 25,32" fill="#FBEA6B"/>
    <line x1="52" y1="48" x2="52" y2="80"/>
    <!-- ojo (cubito) -->
    <polygon points="64,34 71,38 71,46 64,50 57,46 57,38" fill="#F7DC3D"/>
    <rect x="61.5" y="39" width="5" height="5" fill="#1A1A1A" stroke="none"/>
    <!-- pecho / ala inferior derecha -->
    <polygon points="57,63 76,56 82,64 66,72" fill="#FBEA6B"/>
  </g>
</svg>
